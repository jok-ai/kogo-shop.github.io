 
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            background: linear-gradient(135deg, #111827, #1e3a8a);
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,.5);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px;
        }

        .search {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #18181b;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search:focus {
            border-color: #147cff;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }

        .game {
            background: #18181b;
            border: 1px solid #29292d;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            transition: .2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #147cff;
        }

        .icon {
            width: 130px;
            height: 130px;
            margin: 0 auto 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #147cff, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .game h2 {
            font-size: 17px;
            margin: 8px 0;
        }

        .download {
            display: block;
            padding: 10px;
            background: #147cff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }

        .download:hover {
            background: #075dcc;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 24px;
            }

            .games {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .icon {
                width: 105px;
                height: 105px;
                font-size: 42px;
            }

            .game h2 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 PS3 GAMES</h1>
    <p>Игры для PlayStation 3</p>
</header>

<div class="container">

    <input
        class="search"
        type="text"
        id="search"
        placeholder="🔎 Поиск игры..."
        onkeyup="searchGames()"
    >

    <div class="games" id="games">

        <div class="game">
            <div class="icon">🚗</div>
            <h2>GTA V</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">⛏️</div>
            <h2>Minecraft</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">⚔️</div>
            <h2>God of War</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">🧟</div>
            <h2>The Last of Us</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">🏎️</div>
            <h2>Gran Turismo 6</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">🦇</div>
            <h2>Batman Arkham City</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">🔫</div>
            <h2>Call of Duty</h2>
            <a class="download" href="#">Скачать</a>
        </div>

        <div class="game">
            <div class="icon">🏎️</div>
            <h2>Need for Speed</h2>
            <a class="download" href="#">Скачать</a>
        </div>

    </div>
</div>

<footer>
    PS3 Games © 2026
</footer>

<script>
function searchGames() {
    let input = document.getElementById("search").value.toLowerCase();
    let games = document.querySelectorAll(".game");

    games.forEach(function(game) {
        let name = game.querySelector("h2").textContent.toLowerCase();

        if (name.includes(input)) {
            game.style.display = "";
        } else {
            game.style.display = "none";
        }
    });
}
</script>

</body>
</html>
